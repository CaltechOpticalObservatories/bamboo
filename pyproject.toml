[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboo"
version = "0.1.0"
description = "Panda!"
requires-python = ">=3.9"

[project.optional-dependencies]
docs = ["sphinx>=7", "shibuya", "sphinxcontrib-mermaid"]

[tool.setuptools]
packages = ["bamboo"]

[tool.setuptools.package-dir]
"bamboo" = "protocol"
